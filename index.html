<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizzteq OS</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030305;color:#94a3b8;font-family:system-ui,sans-serif}</style>
</head>
<body>
  <p id="s">Loading studio…</p>
  <script>
  (async () => {
    try {
      const url = 'https://cdn.jsdelivr.net/gh/thekakodkar/bizzOS@441ae70b2333cd64e1c427da3c50f246e7bae72b/index.html';
      const r = await fetch(url + '?t=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      let html = await r.text();
      const lean = '\n(function(){\n  if (window.__bizzLeanV2) return; window.__bizzLeanV2 = 1;\n\n  var css = `\n  .fold{background:rgba(24,24,27,.85);border:1px solid rgba(63,63,70,.55);border-radius:10px;overflow:hidden;transition:border-color .2s,box-shadow .2s}\n  .fold:hover{border-color:rgba(96,165,250,.4);box-shadow:0 0 0 1px rgba(59,130,246,.08)}\n  .fold-head{display:flex;align-items:center;justify-content:space-between;gap:.55rem;padding:.55rem .8rem;cursor:pointer;user-select:none;background:linear-gradient(180deg,rgba(15,23,42,.55),rgba(9,9,11,.35))}\n  .fold-head:hover{background:rgba(59,130,246,.1)}\n  .fold-title{font-size:.7rem;font-weight:700;color:#93c5fd;text-transform:uppercase;letter-spacing:.55px;display:flex;align-items:center;gap:.45rem}\n  .fold-meta{font-size:.64rem;color:#94a3b8;font-weight:500;white-space:nowrap}\n  .fold-chevron{width:15px;height:15px;color:#94a3b8;transition:transform .22s cubic-bezier(.34,1.2,.64,1);flex:0 0 auto}\n  .fold.open .fold-chevron{transform:rotate(90deg);color:#60a5fa}\n  .fold-body{display:none;padding:.65rem .8rem .8rem;border-top:1px solid rgba(63,63,70,.35);flex-direction:column;gap:.65rem}\n  .fold.open .fold-body{display:flex}\n\n  #tab-inbound .mapper-header,#tab-pulse .mapper-header{padding:.5rem .75rem!important;margin-bottom:.4rem!important;gap:.4rem!important}\n  #tab-inbound .inbound-subbar{padding:.35rem .55rem!important;margin-bottom:.4rem!important;gap:.4rem!important;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;background:rgba(9,9,11,.45);border:1px solid rgba(63,63,70,.5);border-radius:10px}\n  #tab-inbound .inbound-pill{padding:.32rem .6rem!important;font-size:.66rem!important;border-radius:7px}\n  #tab-inbound .inbound-filter-bar input{padding:.32rem .55rem!important;font-size:.74rem!important;min-width:140px;border-radius:7px}\n  #tab-inbound .inbound-mapper-card{padding:.5rem!important;gap:.4rem!important;border-radius:10px}\n  #tab-inbound .map-row{padding:.55rem .7rem!important;gap:.35rem!important;border-radius:8px}\n  #tab-inbound .map-row-main{gap:.5rem!important}\n  #tab-inbound .inbound-mapping-input{padding:.4rem .55rem!important;font-size:.78rem!important}\n  #tab-inbound .btn-mini{padding:.25rem .5rem;font-size:.65rem}\n  #inboundMapperContainer{gap:.4rem!important}\n\n  .pulse-grid{gap:.75rem!important;grid-template-columns:minmax(300px,420px) minmax(0,1fr)!important}\n  .pulse-controls{gap:.45rem!important;padding-right:.25rem!important;padding-bottom:.5rem!important}\n  .pulse-subtabs{padding:.25rem!important;gap:.25rem!important;border-radius:10px!important}\n  .pulse-subtab{padding:.4rem .35rem!important;font-size:.64rem!important;border-radius:7px!important}\n  .pulse-pane{gap:.45rem!important}\n  .pulse-fold-bar{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:.15rem .1rem .05rem;flex-shrink:0}\n  .pulse-fold-bar .fold-hint{font-size:.62rem;color:#94a3b8;letter-spacing:.2px}\n  .pulse-fold-bar .btn-mini{padding:.22rem .5rem;font-size:.62rem;border-radius:6px}\n\n  .pulse-card{padding:0!important;gap:0!important;overflow:hidden;border-radius:10px!important;transition:border-color .2s}\n  .pulse-card:hover{border-color:rgba(96,165,250,.35)}\n  .pulse-card>.pulse-card-title{margin:0!important;padding:.55rem .75rem!important;cursor:pointer;user-select:none;background:linear-gradient(180deg,rgba(15,23,42,.55),rgba(9,9,11,.35));border-bottom:none!important;font-size:.7rem!important;gap:.4rem!important;display:flex;align-items:center}\n  .pulse-card>.pulse-card-title:hover{background:rgba(59,130,246,.1)}\n  .pulse-card-body{display:none;flex-direction:column;gap:.55rem;padding:.65rem .75rem .8rem;border-top:1px solid rgba(63,63,70,.35)}\n  .pulse-card.open>.pulse-card-body{display:flex}\n  .pulse-card .pulse-card-title .fold-chevron{margin-left:auto;width:14px;height:14px;flex-shrink:0;transition:transform .22s cubic-bezier(.34,1.2,.64,1)}\n  .pulse-card.open .pulse-card-title .fold-chevron{transform:rotate(90deg);color:#60a5fa}\n  .pulse-card .pulse-card-title .badge{font-size:.58rem;padding:.12rem .4rem}\n\n  .field-row{gap:.5rem!important}\n  .field-col{gap:.22rem!important}\n  .field-col label{font-size:.66rem!important}\n  .pulse-controls input[type="text"],.pulse-controls select{padding:.42rem .6rem!important;font-size:.76rem!important;border-radius:7px!important}\n  .toggle-grid{gap:.45rem!important;padding:.55rem!important;border-radius:8px!important}\n  .toggle-grid .toggle-label{font-size:.68rem!important}\n  .step-chip{padding:.32rem .45rem!important;gap:.35rem!important;border-radius:7px!important;grid-template-columns:minmax(0,1fr) 120px 28px!important}\n  .step-chip input,.step-chip select{padding:.35rem .45rem!important;font-size:.74rem!important}\n  .sample-col-row input{padding:.32rem .45rem!important;font-size:.72rem!important}\n  .preset-pill{padding:.28rem .5rem!important;font-size:.65rem!important;border-radius:6px!important}\n  #pulsePreviewFrame{min-height:440px!important}\n  .preview-stage{min-height:460px!important}\n  .preview-toolbar{padding:.5rem .85rem!important;font-size:.7rem!important}\n  .preview-frame-wrap{padding:1rem!important}\n  .hint-chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.6rem;color:#94a3b8;font-weight:500;padding:.12rem .4rem;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(63,63,70,.5)}\n  @media (max-width:1100px){.pulse-grid{grid-template-columns:1fr!important}}\n  `;\n\n  var style = document.createElement('style');\n  style.id = 'bizz-lean-v2';\n  style.textContent = css;\n  document.head.appendChild(style);\n\n  function chevron(){\n    return '<svg class="fold-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';\n  }\n\n  function toggleFold(head){\n    var fold = head.closest('.fold') || head.closest('.pulse-card');\n    if (fold) fold.classList.toggle('open');\n  }\n\n  window.setAllPulseFolds = function(open){\n    document.querySelectorAll('#tab-pulse .pulse-pane.active .pulse-card').forEach(function(c){\n      if (open) c.classList.add('open'); else c.classList.remove('open');\n    });\n  };\n\n  function wirePulse(){\n    var controls = document.querySelector('#tab-pulse .pulse-controls');\n    if (controls && !controls.querySelector('.pulse-fold-bar')) {\n      var sub = controls.querySelector('.pulse-subtabs');\n      var bar = document.createElement('div');\n      bar.className = 'pulse-fold-bar';\n      bar.innerHTML = '<span class="fold-hint">Click section headers to expand / collapse</span><div style="display:flex;gap:.3rem"><button type="button" class="btn-mini" onclick="setAllPulseFolds(true)">Expand</button><button type="button" class="btn-mini" onclick="setAllPulseFolds(false)">Collapse</button></div>';\n      if (sub && sub.nextSibling) controls.insertBefore(bar, sub.nextSibling);\n      else if (sub) sub.insertAdjacentElement('afterend', bar);\n      else controls.prepend(bar);\n    }\n\n    document.querySelectorAll('#tab-pulse .pulse-card').forEach(function(card){\n      var title = card.querySelector(':scope > .pulse-card-title');\n      if (!title || title.dataset.foldWired) return;\n      title.dataset.foldWired = '1';\n      var body = card.querySelector(':scope > .pulse-card-body');\n      if (!body) {\n        body = document.createElement('div');\n        body.className = 'pulse-card-body';\n        Array.from(card.childNodes).forEach(function(n){\n          if (n !== title && !(n.nodeType === 3 && !String(n.textContent||'').trim())) body.appendChild(n);\n        });\n        card.appendChild(body);\n      }\n      if (!title.querySelector('.fold-chevron')) title.insertAdjacentHTML('beforeend', chevron());\n      title.onclick = function(e){\n        if (e.target.closest('button,input,select,a,label')) return;\n        toggleFold(title);\n      };\n      title.title = 'Click to expand / collapse';\n      var pane = card.closest('.pulse-pane');\n      var first = pane && pane.querySelector('.pulse-card');\n      if (card === first) card.classList.add('open');\n      else card.classList.remove('open');\n    });\n  }\n\n  function boot(){\n    try { wirePulse(); } catch(e) {}\n  }\n\n  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);\n  else boot();\n  document.addEventListener('click', function(e){\n    if (e.target && e.target.classList && e.target.classList.contains('pulse-subtab')) {\n      setTimeout(wirePulse, 50);\n    }\n  });\n})();\n';
      const tag = '<scr' + 'ipt>' + lean + '</scr' + 'ipt>';
      if (html.includes('</body>')) html = html.replace('</body>', tag + '</body>');
      else html += tag;
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('s').textContent = 'Could not load studio: ' + e.message;
    }
  })();
  </script>
</body>
</html>
