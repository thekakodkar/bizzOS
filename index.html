<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizzteq OS</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030305;color:#94a3b8;font-family:system-ui,sans-serif}</style>
</head>
<body>
  <p id="s">Loading studio…</p>
  <script>
  (async () => {
    try {
      const url = 'https://cdn.jsdelivr.net/gh/thekakodkar/bizzOS@441ae70b2333cd64e1c427da3c50f246e7bae72b/index.html';
      const r = await fetch(url + '?t=' + Date.now());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const html = await r.text();
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('s').textContent = 'Could not load studio: ' + e.message;
    }
  })();
  </script>
</body>
</html>
