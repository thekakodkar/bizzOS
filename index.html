<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizzteq OS</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030305;color:#94a3b8;font-family:system-ui,sans-serif}#s{text-align:center;line-height:1.6}code{font-size:.85em;opacity:.8}</style>
</head>
<body>
  <p id="s">Loading studio…</p>
  <script>
  (async () => {
    const el = document.getElementById('s');
    try {
      const parts = ['part00.txt','part01.txt','part02.txt','part03.txt','part04.txt','part05.txt'];
      const chunks = [];
      for (const p of parts) {
        el.textContent = 'Loading studio… (' + p + ')';
        const r = await fetch('./' + p + '?t=' + Date.now());
        if (!r.ok) throw new Error('Failed to load ' + p + ' (HTTP ' + r.status + ')');
        chunks.push(await r.text());
      }
      const html = chunks.join('');
      if (!html.includes('mapperContainer') && !html.includes('BODTOJSON')) {
        throw new Error('Joined chunks do not look like the studio');
      }
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      el.innerHTML = 'Could not load studio.<br><code>' + String(e.message || e) + '</code><br><br>Hard-refresh or try again in a moment.';
      console.error(e);
    }
  })();
  </script>
</body>
</html>
